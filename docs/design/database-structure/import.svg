<rect x="665" y="490" width="275" height="105" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="802.5" y="520" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">mpp_fingerprint</text>
