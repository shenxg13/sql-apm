<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="890" viewBox="0 0 1380 890" role="img" aria-labelledby="title desc">
<title id="title">构建、结果、发布与月份清理</title><desc id="desc">箭头表示主要引用方向；浅橙色为结果清理相关结构，分组定义不删除</desc>
