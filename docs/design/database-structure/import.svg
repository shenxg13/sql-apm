<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="650" viewBox="0 0 1290 650" role="img" aria-labelledby="title desc">
<title id="title">导入主链：文件、证据、执行和指纹</title><desc id="desc">箭头从引用方指向被引用方；只画主链 11 表，其他关联见正文</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#738397"/></marker></defs>
<rect width="1290" height="650" fill="white"/>
<text x="28" y="40" font-family="sans-serif" font-size="25" font-weight="bold" fill="#172c43">导入主链：文件、证据、执行和指纹</text>
<text x="28" y="70" font-family="sans-serif" font-size="17" fill="#4a5968">箭头从引用方指向被引用方；只画主链 11 表，其他关联见正文</text>
