<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="800" viewBox="0 0 1370 800" role="img" aria-labelledby="title desc">
<title id="title">快照封存输入与配置</title><desc id="desc">左侧是输入成员，右侧是规则；保留月数是操作策略，不封存到训练配置</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#738397"/></marker></defs>
<rect width="1370" height="800" fill="white"/>
<text x="28" y="40" font-family="sans-serif" font-size="25" font-weight="bold" fill="#172c43">快照封存输入与配置</text>
<text x="28" y="70" font-family="sans-serif" font-size="17" fill="#4a5968">左侧是输入成员，右侧是规则；保留月数是操作策略，不封存到训练配置</text>
<path d="M 450 655 H 8 V 175 H 25" fill="none" stroke="#738397" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 900 655 H 700 V 175 H 735" fill="none" stroke="#738397" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1195 225 V 330" fill="none" stroke="#738397" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1195 525 V 430" fill="none" stroke="#738397" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1055 575 H 1020" fill="none" stroke="#738397" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="125" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="167.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_snapshot</text>
<text x="167.5" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">输入快照</text>
<rect x="355" y="125" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="497.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_manifest</text>
<text x="497.5" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">清单全文与封存标记</text>
<rect x="25" y="285" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="167.5" y="315" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_batch</text>
<text x="167.5" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">按窗口选入的完整批次</text>
<rect x="355" y="285" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="497.5" y="315" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_file</text>
<text x="497.5" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">批次内文件整批保留</text>
<rect x="25" y="445" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="167.5" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_analysis</text>
<text x="167.5" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">选用的解释</text>
<rect x="355" y="445" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="497.5" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">input_file_analysis</text>
<text x="497.5" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">文件对应的解释</text>
<rect x="735" y="125" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="877.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">config_snapshot</text>
<text x="877.5" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">窗口、排除时段、门槛</text>
<rect x="1055" y="125" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="1197.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">training_config</text>
<text x="1197.5" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">指向封存规则</text>
<rect x="1055" y="330" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="1197.5" y="360" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">mpp_training_rule</text>
<text x="1197.5" y="387" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">跨快照共用</text>
<rect x="1055" y="525" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="1197.5" y="555" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">mpp_training_sql</text>
<text x="1197.5" y="582" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">每条 SQL 的分类缓存</text>
<rect x="735" y="525" width="285" height="100" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="877.5" y="555" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">mpp_sql_text</text>
<text x="877.5" y="582" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">导入的去重原文</text>
<rect x="430" y="655" width="500" height="100" rx="10" fill="#e9f3ff" stroke="#2675bd" stroke-width="2"/>
<text x="680.0" y="685" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">build</text>
<text x="680.0" y="712" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">引用 input_id 和 config_id</text>
</svg>
