<rect x="25" y="110" width="275" height="105" rx="10" fill="#f7f9fb" stroke="#b9c5cf" stroke-width="2"/>
<text x="162.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">source_file</text>
<text x="162.5" y="167" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">文件与 SHA-256</text>
<text x="162.5" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">first_log_at / last_log_at</text>
