<text x="482.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172c43">import_attempt</text>
<text x="482.5" y="167" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a5968">每次导入尝试</text>
